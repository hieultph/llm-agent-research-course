<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" width="640" height="236" font-family="DejaVu Sans" font-size="11" fill="#33332f">
  <!-- Dataset construction: sources -> 52 cases in four groups -> prompts -> answers. Edit in Inkscape or draw.io. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
  </defs>
  <style>
    .box { stroke: #8a8a85; stroke-width: 1; rx: 4; }
    .src { fill: #eef4fc; }
    .grp { fill: #f4f4f2; }
    .out { fill: #fdf3e6; }
    .drop { fill: #ffffff; stroke-dasharray: 4 3; }
    .b { font-weight: bold; }
    .m { fill: #6b6b66; font-size: 10px; }
    .ln { stroke: #6b6b66; stroke-width: 1.2; fill: none; marker-end: url(#arr); }
  </style>

  <!-- sources -->
  <rect class="box src" x="4" y="8" width="170" height="52"/>
  <text x="14" y="26" class="b">Levine et al. 2024</text>
  <text x="14" y="41">48 lay vignettes, MIT</text>
  <text x="14" y="54" class="m">physician labels, 4 levels</text>

  <rect class="box src" x="4" y="72" width="170" height="52"/>
  <text x="14" y="90" class="b">Ramaswamy et al. 2026</text>
  <text x="14" y="105">30 scenarios, CC0</text>
  <text x="14" y="118" class="m">3 physicians, levels A–D</text>

  <rect class="box drop" x="4" y="138" width="170" height="90"/>
  <text x="14" y="155" class="b">Dropped</text>
  <text x="14" y="170" class="m">needs laboratory values</text>
  <text x="14" y="183" class="m">suicidal ideation</text>
  <text x="14" y="196" class="m">no Vietnamese counterpart</text>
  <text x="14" y="209" class="m">label disagrees with Semigran</text>
  <text x="14" y="222" class="m">near-duplicates</text>

  <!-- arrows sources -> cases -->
  <path class="ln" d="M174,34 L214,34 L214,62 L232,62"/>
  <text x="182" y="28" class="m">33</text>
  <path class="ln" d="M174,98 L214,98 L214,72 L232,72"/>
  <text x="182" y="92" class="m">19</text>

  <!-- 52 cases -->
  <rect class="box grp" x="234" y="8" width="176" height="220"/>
  <text x="244" y="26" class="b">52 cases, source labels kept</text>
  <rect class="box" x="244" y="38" width="156" height="40" fill="#fbe9e5"/>
  <text x="252" y="54" class="b">Emergency 14</text>
  <text x="252" y="69" class="m">12 Levine + 2 Ramaswamy</text>
  <rect class="box" x="244" y="84" width="156" height="40" fill="#fdf3e6"/>
  <text x="252" y="100" class="b">Urgent 10</text>
  <text x="252" y="115" class="m">Ramaswamy C/D</text>
  <rect class="box" x="244" y="130" width="156" height="40" fill="#eef4fc"/>
  <text x="252" y="146" class="b">Soon 15</text>
  <text x="252" y="161" class="m">11 Levine + 4 Ramaswamy</text>
  <rect class="box" x="244" y="176" width="156" height="40" fill="#eaf6f0"/>
  <text x="252" y="192" class="b">Self-care 13</text>
  <text x="252" y="207" class="m">10 Levine + 3 Ramaswamy</text>

  <!-- arrows to outputs -->
  <path class="ln" d="M410,70 L454,70"/>
  <text x="432" y="62" class="m" text-anchor="middle">× 5</text>

  <rect class="box out" x="456" y="40" width="180" height="60"/>
  <text x="466" y="58" class="b">260 prompts</text>
  <text x="466" y="73" class="m">clin, clin_nd, folk, folk_nd,</text>
  <text x="466" y="86" class="m">folk_rem (+ a folk remedy)</text>

  <path class="ln" d="M546,100 L546,128"/>
  <text x="552" y="118" class="m">× 9 models</text>

  <rect class="box out" x="456" y="130" width="180" height="44"/>
  <text x="466" y="148" class="b">2,340 answers</text>
  <text x="466" y="163" class="m">labelled by the LLM judge</text>

  <text x="456" y="196" class="m">Emergency: primary outcome</text>
  <text x="456" y="209" class="m">Urgent: secondary outcome</text>
  <text x="456" y="222" class="m">Soon + self-care: controls</text>
</svg>
